name: create-endpoint

on:
  workflow_call:
    inputs:
      endpoint_file:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      endpoint_name:
        required: true
        type: string
      endpoint_type:
        required: true
        type: string
    secrets:
      creds:
        required: true

jobs:
  create-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: "Az CLI login (Service Principal)"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.creds }}
          enable-AzPSSession: true

      - name: install-extension
        run: az extension add -n ml -y

      - name: update-extension
        run: az extension update -n ml

      - name: create-or-update-endpoint
        run: |
          # create fails if the endpoint already exists, so update it instead
          if az ml ${{ inputs.endpoint_type }}-endpoint show \
              --name ${{ inputs.endpoint_name }} \
              --resource-group ${{ inputs.resource_group }} \
              --workspace-name ${{ inputs.workspace_name }} > /dev/null 2>&1; then
            action=update
          else
            action=create
          fi
          az ml ${{ inputs.endpoint_type }}-endpoint $action \
            --name ${{ inputs.endpoint_name }} \
            -f ${{ github.workspace }}/${{ inputs.endpoint_file }} \
            --resource-group ${{ inputs.resource_group }} \
            --workspace-name ${{ inputs.workspace_name }}
